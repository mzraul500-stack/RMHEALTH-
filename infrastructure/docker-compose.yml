# =============================================================================
# RMHEALTH MEDICAL SYSTEM - DOCKER COMPOSE CONFIGURATION
# =============================================================================
# Production Medical MVP - PostgreSQL + TimescaleDB + FastAPI
# Date: April 20, 2026

version: '3.8'

services:
  # =============================================================================
  # DATABASE - PostgreSQL with TimescaleDB Extension
  # =============================================================================
  rmhealth-db:
    image: timescale/timescaledb:latest-pg15
    container_name: rmhealth-medical-db
    restart: always
    environment:
      POSTGRES_USER: rmhealth_user
      POSTGRES_PASSWORD: rmhealth_secure_2026
      POSTGRES_DB: rmhealth_medical_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - rmhealth_db_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - rmhealth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmhealth_user -d rmhealth_medical_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =============================================================================
  # BACKEND API - FastAPI Medical Service
  # =============================================================================
  rmhealth-api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: production
    container_name: rmhealth-medical-api
    restart: always
    ports:
      - "8000:8000"
      - "8001:8001"  # WebSocket for real-time vitals
    environment:
      - DATABASE_URL=postgresql+asyncpg://rmhealth_user:rmhealth_secure_2026@rmhealth-db:5432/rmhealth_medical_db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - JWT_SECRET_KEY=rm_health_medical_jwt_secret_key_2026_hipaa_compliant
      - HIPAA_ENABLED=true
      - EDGE_AI_ENABLED=true
      - LOG_LEVEL=INFO
    volumes:
      - ../logs:/app/logs
      - ../models:/app/models
      - rmhealth_uploads:/app/uploads
    depends_on:
      rmhealth-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - rmhealth-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # REDIS CACHE - Session & Real-time Data Cache
  # =============================================================================
  redis-cache:
    image: redis:7-alpine
    container_name: rmhealth-redis-cache
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - rmhealth_redis_data:/data
    networks:
      - rmhealth-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # NGINX REVERSE PROXY - Load Balancer & SSL
  # =============================================================================
  rmhealth-proxy:
    image: nginx:alpine
    container_name: rmhealth-medical-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - rmhealth-api
    networks:
      - rmhealth-network

  # =============================================================================
  # MONITORING - Prometheus & Grafana (Optional)
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: rmhealth-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - rmhealth_prometheus_data:/prometheus
    networks:
      - rmhealth-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  grafana:
    image: grafana/grafana:latest
    container_name: rmhealth-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=rmhealth_grafana_admin_2026
    volumes:
      - rmhealth_grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - rmhealth-network

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  rmhealth-network:
    driver: bridge
    name: rmhealth-medical-network

# =============================================================================
# VOLUMES (Persistent Data Storage)
# =============================================================================
volumes:
  rmhealth_db_data:
    driver: local
    name: rmhealth_medical_db_data
  rmhealth_redis_data:
    driver: local
    name: rmhealth_redis_data
  rmhealth_uploads:
    driver: local
    name: rmhealth_medical_uploads
  rmhealth_prometheus_data:
    driver: local
    name: rmhealth_prometheus_data
  rmhealth_grafana_data:
    driver: local
    name: rmhealth_grafana_data

